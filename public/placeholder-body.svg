  <circle cx="100" cy="55" r="30" fill="#D4C4A8"/>
  <circle cx="90" cy="50" r="2.5" fill="#3D2C1E"/>
  <circle cx="110" cy="50" r="2.5" fill="#3D2C1E"/>
  <path d="M93 62 Q100 67 107 62" stroke="#3D2C1E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="92" y="83" width="16" height="12" rx="3" fill="#D4C4A8"/>
  <!-- Torso -->
  <path d="M60 110 L80 95 L120 95 L140 110 L135 200 L65 200 Z" fill="#C4A882" opacity="0.7" rx="5"/>
