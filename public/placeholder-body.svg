  <line x1="68" y1="170" x2="132" y2="170" stroke="#7A6654" stroke-width="0.5" stroke-dasharray="4 2"/>
  <!-- Legs -->
  <path d="M70 200 L65 350 L85 350 L95 210" fill="#C4A882" opacity="0.5"/>
  <path d="M130 200 L135 350 L115 350 L105 210" fill="#C4A882" opacity="0.5"/>
  <!-- Feet -->
  <ellipse cx="75" cy="355" rx="15" ry="6" fill="#A89279"/>
  <ellipse cx="125" cy="355" rx="15" ry="6" fill="#A89279"/>
  <!-- Measurement guides -->
  <line x1="55" y1="130" x2="145" y2="130" stroke="#C4A882" stroke-width="0.8" stroke-dasharray="3 2"/>
  <line x1="62" y1="155" x2="138" y2="155" stroke="#C4A882" stroke-width="0.8" stroke-dasharray="3 2"/>
  <!-- Label -->
  <text x="100" y="420" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#7A6654">Body Model</text>
</svg>
